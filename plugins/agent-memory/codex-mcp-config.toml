# Add to ~/.codex/config.toml (or .codex/config.toml in a trusted project),
# or run: agenthaus install --target codex --plugin <name>

# NOTE: export DATABASE_URI="$NEON_DATABASE_URL" before starting Codex
[mcp_servers.postgres]
command = "uvx"
args = ["postgres-mcp@0.3.0", "--access-mode=unrestricted"]
env_vars = ["DATABASE_URI"]
