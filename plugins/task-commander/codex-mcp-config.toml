# Add to your Codex config.toml

[mcp.servers.clickup]
command = "npx"
args = ["-y", "@taazkareem/clickup-mcp-server"]
[mcp.servers.clickup.env]
CLICKUP_API_KEY = "${CLICKUP_API_KEY}"

[mcp.servers.slack]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack"]
[mcp.servers.slack.env]
SLACK_BOT_TOKEN = "${SLACK_BOT_TOKEN}"
SLACK_DEFAULT_CHANNEL = "${SLACK_CHANNEL}"

[mcp.servers.gmail]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-gmail"]
[mcp.servers.gmail.env]
GMAIL_CREDENTIALS = "${GMAIL_CREDENTIALS}"

[mcp.servers.google-calendar]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-google-calendar"]
[mcp.servers.google-calendar.env]
GOOGLE_CALENDAR_TOKEN = "${GOOGLE_CALENDAR_TOKEN}"
