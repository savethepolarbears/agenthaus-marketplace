# Add to ~/.codex/config.toml (or .codex/config.toml in a trusted project),
# or run: agenthaus install --target codex --plugin <name>

[mcp_servers.cloudflare]
command = "npx"
args = ["-y", "@cloudflare/mcp-server-cloudflare"]
env_vars = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]

# NOTE: export GITHUB_PERSONAL_ACCESS_TOKEN="$GITHUB_TOKEN" before starting Codex
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]

# NOTE: export SLACK_DEFAULT_CHANNEL="$SLACK_CHANNEL" before starting Codex
[mcp_servers.slack]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack"]
env_vars = ["SLACK_BOT_TOKEN", "SLACK_DEFAULT_CHANNEL"]
