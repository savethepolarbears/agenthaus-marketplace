# Add to ~/.codex/config.toml (or .codex/config.toml in a trusted project),
# or run: agenthaus install --target codex --plugin <name>

[mcp_servers.neuronwriter]
url = "https://app.neuronwriter.com/mcp/http"

[mcp_servers.textfocus]
command = "python3"
args = ["-m", "textfocus_server"]
env_vars = ["TEXTFOCUS_API_KEY"]

[mcp_servers.markupgo]
command = "npx"
args = ["-y", "markupgo-mcp-server"]
env_vars = ["MARKUPGO_API_KEY"]

[mcp_servers.outscraper]
command = "npx"
args = ["-y", "outscraper-mcp@0.2.5"]
env_vars = ["OUTSCRAPER_API_KEY"]
