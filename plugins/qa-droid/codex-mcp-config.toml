# Add to ~/.codex/config.toml (or .codex/config.toml in a trusted project),
# or run: agenthaus install --target codex --plugin <name>

# NOTE: replace ${CLAUDE_PLUGIN_ROOT} with the plugin's install path
[mcp_servers.playwright-local]
command = "node"
args = ["${CLAUDE_PLUGIN_ROOT}/index.js"]

# NOTE: export SLACK_DEFAULT_CHANNEL="$SLACK_CHANNEL" before starting Codex
[mcp_servers.slack]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack"]
env_vars = ["SLACK_BOT_TOKEN", "SLACK_DEFAULT_CHANNEL"]

[mcp_servers.gmail]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-gmail"]
env_vars = ["GMAIL_CREDENTIALS"]
