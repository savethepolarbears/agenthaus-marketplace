name: CI & Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Plugins & Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate skills index
        run: bash scripts/generate-skills-index.sh

      - name: Validate all marketplace plugins
        run: bash scripts/validate-plugins.sh

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: Verify cross-platform generator consistency
        run: |
          node scripts/generate-cross-platform.js
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Generated files are out of sync or produced untracked artifacts:"
            git status --porcelain --untracked-files=all
            exit 1
          fi

      - name: Guard against destructive git commands
        run: |
          if git grep -nE 'git push.*(--force|-f)\b' -- '*.sh' '*.js' '*.py'; then
            echo "ERROR: Destructive git push --force detected in script files."
            exit 1
          fi

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'plugins/qa-droid/package-lock.json'

      - name: Run npm audit in qa-droid
        working-directory: plugins/qa-droid
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
