name: CI & Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Plugins & Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq python3-jsonschema

      - name: Generate skills index
        run: bash scripts/generate-skills-index.sh

      - name: Validate all marketplace plugins
        run: bash scripts/validate-plugins.sh

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: Isolated runtime health and two-pass generator integrity
        run: node scripts/check-runtime-health.js --out reports/phase08-runtime-health.json

      - name: Verify exact-source local receipt
        run: node scripts/check-runtime-health.js --verify reports/phase08-runtime-health.json

      - name: Upload sanitized local evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase08-local-health
          path: reports/phase08-runtime-health.json
          if-no-files-found: error
          retention-days: 7

      - name: Guard against absolute file:// links in documentation
        run: |
          if git grep -nE 'file:///' -- '*.md'; then
            echo "ERROR: Local absolute file:/// links detected in markdown documentation."
            exit 1
          fi

      - name: Guard against destructive git commands
        run: |
          FAILED=0
          if git grep -nE 'git push.*(--force|-f)\b' -- '*.sh' '*.js' '*.py' '*.yml' '*.yaml' '*.md' '*.ts' '*.php' 'Makefile' ':!reports/*' | grep -v -- '--force-with-lease'; then
            echo "ERROR: Destructive git push --force detected without --force-with-lease."
            FAILED=1
          fi
          if git grep -nE 'git (push.*(--mirror|--delete)|filter-repo|filter-branch)\b' -- '*.sh' '*.js' '*.py' '*.yml' '*.yaml' '*.md' '*.ts' '*.php' 'Makefile' ':!reports/*'; then
            echo "ERROR: Destructive git mirror/delete/filter-repo command detected."
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

  test:
    name: Test Suite (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Generate skills index
        run: bash scripts/generate-skills-index.sh
        shell: bash

      - name: Run test suite
        run: node --test

  qa-droid-smoke:
    name: QA-Droid MCP Smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugins/qa-droid/package-lock.json
      - name: Install locked dependencies
        working-directory: plugins/qa-droid
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: plugins/qa-droid
        run: npx playwright install --with-deps chromium
      - name: Verify MCP startup and browser tool
        working-directory: plugins/qa-droid
        run: npm test

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'plugins/qa-droid/package-lock.json'

      - name: Run npm audit in qa-droid
        working-directory: plugins/qa-droid
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Note: gitleaks-action is free for public repositories. If transferred or
      # mirrored as an organization-owned private repository, GITLEAKS_LICENSE is required.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
