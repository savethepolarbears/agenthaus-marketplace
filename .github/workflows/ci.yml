name: CI & Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Plugins & Marketplace
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate skills index
        run: bash scripts/generate-skills-index.sh

      - name: Validate all marketplace plugins
        run: bash scripts/validate-plugins.sh

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: Verify cross-platform generator consistency
        run: |
          node scripts/generate-cross-platform.js
          DRIFT_STATUS=$(git status --porcelain --untracked-files=all -- \
            '*claude-desktop-snippet.json' '*gemini-settings-snippet.json' \
            '*windsurf-mcp-snippet.json' '*codex-mcp-config.toml' \
            '.cursor' 'GEMINI.md' 'AGENTS.md' 'skills_index.json')
          if [ -n "$DRIFT_STATUS" ]; then
            echo "Generated files are out of sync or produced untracked artifacts:"
            echo "$DRIFT_STATUS"
            exit 1
          fi

      - name: Guard against absolute file:// links in documentation
        run: |
          if git grep -nE 'file:///' -- '*.md'; then
            echo "ERROR: Local absolute file:/// links detected in markdown documentation."
            exit 1
          fi

      - name: Guard against destructive git commands
        run: |
          FAILED=0
          if git grep -nE 'git push.*(--force|-f)\b' -- '*.sh' '*.js' '*.py' '*.yml' '*.yaml' '*.md' '*.ts' '*.php' 'Makefile' ':!reports/*' | grep -v -- '--force-with-lease'; then
            echo "ERROR: Destructive git push --force detected without --force-with-lease."
            FAILED=1
          fi
          if git grep -nE 'git (push.*(--mirror|--delete)|filter-repo|filter-branch)\b' -- '*.sh' '*.js' '*.py' '*.yml' '*.yaml' '*.md' '*.ts' '*.php' 'Makefile' ':!reports/*'; then
            echo "ERROR: Destructive git mirror/delete/filter-repo command detected."
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

  test:
    name: Test Suite (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite
        run: node --test 'tests/**/*.test.js'

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'plugins/qa-droid/package-lock.json'

      - name: Run npm audit in qa-droid
        working-directory: plugins/qa-droid
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Note: gitleaks-action is free for public repositories. If transferred or
      # mirrored as an organization-owned private repository, GITLEAKS_LICENSE is required.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
